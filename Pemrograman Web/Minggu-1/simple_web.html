<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Lomba Makan</title>
</head>
<body>

    <header>
        <h1>Pendaftaran Lomba Makan</h1>
        <p>Isi form ini untuk daftar dalam lomba makan</p>
    </header>

    <main>

        <section>
            <h2>Biodata Calon Peserta</h2>
<!-- Formnya -->
            <form action="" method="POST">
                
                <label for="nama">Nama Lengkap:</label><br>
                <input type="text" id="nama" name="nama"><br><br>

                <label for="umur">Umur (tahun):</label><br>
                <input type="number" id="umur" name="umur"><br><br>

                <label for="kelas_berat">Pilih Kelas Berat:</label><br>
                <select id="kelas_berat" name="kelas_berat">
                    <option value="bulu">Bulu</option>
                    <option value="menengah">Menengah</option>
                    <option value="berat">Berat</option>
                    <option value="monster">Monster</option>
                </select><br><br>

                <button type="submit">Daftar Sekarang</button>
            </form>

        </section>

    </main>

</body>
</html>
